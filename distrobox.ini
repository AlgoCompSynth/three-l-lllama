[three-l-lllama-CPU]
home=$CONTAINER_HOME
image=docker.io/library/debian:trixie-backports
additional_flags="--security-opt=label=disable"
additional_packages="libpam-systemd systemd"
init=true
pull=true
replace=false
root=false
start_now=true

[three-l-lllama-CUDA]
home=$CONTAINER_HOME
image=docker.io/library/debian:trixie-backports
additional_flags="--security-opt=label=disable --device=nvidia.com/gpu=all"
additional_packages="libpam-systemd systemd"
init=true
pull=true
replace=false
root=false
start_now=true

